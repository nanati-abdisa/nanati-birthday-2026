<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F1E7"/>
      <stop offset="100%" stop-color="#E8D8C3"/>
    </radialGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542D1E"/>
      <stop offset="100%" stop-color="#3B2118"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B2118"/>
      <stop offset="100%" stop-color="#1F110C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D89D"/>
      <stop offset="50%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#B8875A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#3B2118" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="185" fill="#FFFDF8" stroke="#D6B77A" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- Phone Body -->
  <g filter="url(#shadow)">
    <rect x="160" y="75" width="180" height="310" rx="36" fill="url(#phoneGrad)" stroke="#D6B77A" stroke-width="4"/>
    <rect x="175" y="100" width="150" height="255" rx="20" fill="url(#screenGrad)"/>
    <!-- Speaker / camera notch -->
    <rect x="220" y="86" width="60" height="6" rx="3" fill="#D6B77A"/>
    <circle cx="210" cy="89" r="3" fill="#D6B77A"/>
  </g>
  <!-- Screen content -->
  <!-- 5G & WiFi icon -->
  <path d="M 230 145 A 25 25 0 0 1 270 145" fill="none" stroke="#D6B77A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 237 155 A 15 15 0 0 1 263 155" fill="none" stroke="#D6B77A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="165" r="4" fill="#D6B77A"/>
  <text x="250" y="215" fill="url(#goldGrad)" font-family="'Playfair Display', serif" font-size="34" font-weight="bold" text-anchor="middle">5G ULTRA</text>
  <text x="250" y="250" fill="#FFFDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" text-anchor="middle">UNLIMITED</text>
  <text x="250" y="275" fill="#E8D8C3" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Daily High-Speed Data</text>
  <!-- Sparkles -->
  <path d="M 250 295 L 253 305 L 263 308 L 253 311 L 250 321 L 247 311 L 237 308 L 247 305 Z" fill="#D6B77A"/>
  <!-- Label badge -->
  <rect x="125" y="405" width="250" height="48" rx="24" fill="#542D1E"/>
  <text x="250" y="436" fill="#F8F1E7" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Daily Data Package 📶</text>
</svg>