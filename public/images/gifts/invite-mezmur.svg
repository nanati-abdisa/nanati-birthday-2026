<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F1E7"/>
      <stop offset="100%" stop-color="#E8D8C3"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F8F1E7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D89D"/>
      <stop offset="50%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#B8875A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B2118" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="185" fill="#FFFDF8" stroke="#D6B77A" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- Royal Invitation Scroll / Card -->
  <g filter="url(#shadow)">
    <rect x="90" y="80" width="320" height="295" rx="20" fill="url(#cardGrad)" stroke="#D6B77A" stroke-width="3"/>
    <rect x="105" y="95" width="290" height="265" rx="14" fill="none" stroke="#E8D8C3" stroke-width="1.5"/>
  </g>

  <!-- Ethiopian Traditional Cross Emblem Header -->
  <g transform="translate(250, 135) scale(0.65)">
    <rect x="-8" y="-35" width="16" height="70" rx="4" fill="url(#goldGrad)"/>
    <rect x="-35" y="-12" width="70" height="16" rx="4" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-4" r="9" fill="#FFFDF8" stroke="#D6B77A" stroke-width="3"/>
    <!-- Cross details -->
    <circle cx="0" cy="-35" r="5" fill="url(#goldGrad)"/>
    <circle cx="0" cy="35" r="5" fill="url(#goldGrad)"/>
    <circle cx="-35" cy="-4" r="5" fill="url(#goldGrad)"/>
    <circle cx="35" cy="-4" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <text x="250" y="195" fill="#542D1E" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" text-anchor="middle">የዝማሬ ግብዣ</text>
  <text x="250" y="225" fill="#B8875A" font-family="'Playfair Display', serif" font-size="16" font-style="italic" text-anchor="middle">Invite Me to Mezmur</text>
  
  <!-- Begena / Harp graphic & music notes -->
  <path d="M 230 250 Q 250 240 270 250 Q 250 300 230 250 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <circle cx="215" cy="275" r="6" fill="#D6B77A"/>
  <path d="M 221 275 L 221 245 C 221 245 235 250 235 260" fill="none" stroke="#D6B77A" stroke-width="2.5"/>
  <circle cx="280" cy="270" r="5" fill="#D6B77A"/>
  <path d="M 285 270 L 285 242 C 285 242 295 246 295 255" fill="none" stroke="#D6B77A" stroke-width="2.5"/>

  <text x="250" y="315" fill="#542D1E" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">"በዝማሬ ወደ እግዚአብሔር እናቅርብ"</text>
  <text x="250" y="340" fill="#7A4B3A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-anchor="middle">A spiritual fellowship &amp; uplifting hymns</text>

  <!-- Bottom Badge -->
  <rect x="110" y="405" width="280" height="48" rx="24" fill="#542D1E"/>
  <text x="250" y="436" fill="#F8F1E7" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Invite Me to Mezmur 🕊️</text>
</svg>