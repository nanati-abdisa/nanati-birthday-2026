<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F1E7"/>
      <stop offset="100%" stop-color="#E8D8C3"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B77A"/>
      <stop offset="100%" stop-color="#B8875A"/>
    </linearGradient>
    <linearGradient id="sockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542D1E"/>
      <stop offset="100%" stop-color="#3B2118"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#3B2118" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="180" fill="#FFFDF8" stroke="#D6B77A" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- Left Sock -->
  <g filter="url(#shadow)" transform="translate(140, 110) rotate(-12, 100, 150)">
    <!-- Cuff -->
    <rect x="50" y="20" width="80" height="35" rx="10" fill="url(#goldGrad)"/>
    <!-- Leg -->
    <path d="M 50 45 L 50 180 C 50 220 70 250 120 250 L 160 250 C 190 250 200 220 180 190 L 130 140 L 130 45 Z" fill="url(#sockGrad)"/>
    <!-- Stripes / Pattern -->
    <circle cx="85" cy="85" r="7" fill="#D6B77A"/>
    <circle cx="105" cy="115" r="7" fill="#F8F1E7"/>
    <circle cx="75" cy="145" r="7" fill="#D6B77A"/>
    <path d="M 85 100 C 85 90 95 85 100 95 C 105 85 115 90 115 100 C 115 110 100 125 100 125 C 100 125 85 110 85 100 Z" fill="#E8D8C3"/>
    <!-- Heel -->
    <path d="M 50 170 C 40 190 45 220 70 230 C 85 220 90 190 75 170 Z" fill="url(#goldGrad)"/>
    <!-- Toe -->
    <path d="M 160 250 C 180 250 195 235 185 210 C 175 205 150 225 145 245 Z" fill="url(#goldGrad)"/>
  </g>
  <!-- Right Sock -->
  <g filter="url(#shadow)" transform="translate(200, 120) rotate(10, 100, 150)">
    <rect x="50" y="20" width="80" height="35" rx="10" fill="url(#goldGrad)"/>
    <path d="M 50 45 L 50 180 C 50 220 70 250 120 250 L 160 250 C 190 250 200 220 180 190 L 130 140 L 130 45 Z" fill="url(#sockGrad)"/>
    <circle cx="85" cy="85" r="7" fill="#D6B77A"/>
    <circle cx="105" cy="115" r="7" fill="#F8F1E7"/>
    <circle cx="75" cy="145" r="7" fill="#D6B77A"/>
    <path d="M 85 100 C 85 90 95 85 100 95 C 105 85 115 90 115 100 C 115 110 100 125 100 125 C 100 125 85 110 85 100 Z" fill="#E8D8C3"/>
    <path d="M 50 170 C 40 190 45 220 70 230 C 85 220 90 190 75 170 Z" fill="url(#goldGrad)"/>
    <path d="M 160 250 C 180 250 195 235 185 210 C 175 205 150 225 145 245 Z" fill="url(#goldGrad)"/>
  </g>
  <!-- Cute Bow & Tag -->
  <path d="M 220 130 C 200 115 180 135 225 150 C 270 135 250 115 230 130 Z" fill="#D6B77A"/>
  <circle cx="225" cy="140" r="9" fill="#B8875A"/>
  <!-- Label badge -->
  <rect x="135" y="405" width="230" height="48" rx="24" fill="#542D1E"/>
  <text x="250" y="436" fill="#F8F1E7" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Cute Cozy Socks 🧦</text>
</svg>